[project]
name = "reliquary-protocol"
version = "0.1.0"
description = "Shared protocol types, canonicalization, and crypto primitives for Reliquary Ledger + Forge."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Reliquary"}]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["reliquary_protocol"]
