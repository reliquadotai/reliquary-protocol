name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          python -m ruff check reliquary_protocol tests

      - name: Test
        if: always()
        run: |
          pytest -q --junitxml=test-results/unit.xml -o junit_logging=no
      - name: Prepare unit test summary
        if: always()
        run: |
          python - <<'PY_SUMMARY'
          import json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('test-results/unit.xml')
          if report.is_file():
              cases = list(ET.parse(report).getroot().iter('testcase'))
              summary = {'suite': 'unit', 'revision': os.environ['GITHUB_SHA'], 'tests': len(cases)}
              summary.update({name: sum(case.find(tag) is not None for case in cases)
                              for name, tag in [('failures', 'failure'), ('errors', 'error'), ('skipped', 'skipped')]})
              Path('test-results/unit-summary.json').write_text(json.dumps(summary) + '\n')
          PY_SUMMARY
      - name: Retain unit test summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-python-${{ matrix.python-version }}
          path: test-results/unit-summary.json
          retention-days: 7
          if-no-files-found: warn
